# .github/workflows/ci.yml
# Runs the BreathAnew tests and web build on every PR to main and every push to main.
# No AI agents involved. Free on GitHub-hosted runners (public repo).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Alignment test (PR #28) needs the WebKit browser. This step only runs
      # once app/test/align.test.js exists on the branch being tested.
      - name: Install WebKit for alignment test
        if: hashFiles('app/test/align.test.js') != ''
        run: npx playwright install --with-deps webkit
      - name: Unit tests + RTL lint (+ alignment test when present)
        run: npm test
      - name: Web build
        run: npm run build
